name: Build and publish Docker image on tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Add QEMU for multi-platform support (emulation)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tag from git tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          IMAGE_TAG="${RAW_TAG#v}"
          if [ "$IMAGE_TAG" = "$RAW_TAG" ] || [ -z "$IMAGE_TAG" ]; then
            echo "Invalid tag: $RAW_TAG"
            exit 1
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # 2. Updated Build and Push with 'platforms'
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # This creates the manifest referring to both architectures
          platforms: linux/amd64,linux/arm64
          tags: |
            kinesisorg/node-proxy:${{ steps.tag.outputs.image_tag }}
            kinesisorg/node-proxy:latest
