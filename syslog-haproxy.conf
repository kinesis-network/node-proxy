@version: 4.3
@include "scl.conf"

options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("haproxy");
    group("haproxy");
    perm(0664);
    stats(freq(0)); # Replaces obsolete stats_freq
};

source s_haproxy {
    # HAProxy uses dgram (UDP-like) for local syslog by default
    unix-dgram("/var/lib/haproxy/dev/log");
};

destination d_haproxy {
    file("/var/log/haproxy/haproxy-${YEAR}-${MONTH}-${DAY}.log"
        owner("haproxy")
        group("haproxy")
        perm(0664)
    );
};

log {
    source(s_haproxy);
    destination(d_haproxy);
};
