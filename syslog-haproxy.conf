@version: 4.3

source s_haproxy {
    # HAProxy uses dgram (UDP-like) for local syslog by default
    unix-dgram("/var/lib/haproxy/dev/log");
};

destination d_haproxy {
    file("/var/log/haproxy/haproxy.log"
         owner("haproxy")
         group("haproxy")
         perm(0664)
    );
};

log {
    source(s_haproxy);
    destination(d_haproxy);
};
